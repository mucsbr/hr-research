[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hr-intelligence"
version = "0.1.0"
description = "Company intelligence: recruitment, reputation and HR news"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "celery[redis]>=5.4,<6",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.3,<7",
  "playwright>=1.51,<2",
  "cryptography>=44,<47",
  "argon2-cffi>=23,<26",
  "PyJWT>=2.10,<3",
  "feedparser>=6,<7",
  "croniter>=6,<7",
  "langgraph>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: real PostgreSQL/Redis integration", "live: explicit limited external test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
